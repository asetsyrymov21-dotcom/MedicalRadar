services:
  medical-radar:
    build: .
    container_name: medical-radar
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MEDICAL_RADAR_DB_PATH: /data/medical_radar.db
    volumes:
      - medical-radar-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  medical-radar-data:
