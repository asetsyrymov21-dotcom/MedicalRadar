services:
  medical-radar:
    build: .
    container_name: medical-radar
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MEDICAL_RADAR_DB_PATH: "${MEDICAL_RADAR_DB_PATH:-/data/medical_radar.db}"
      MEDICAL_RADAR_ENABLE_SCHEDULER: "${MEDICAL_RADAR_ENABLE_SCHEDULER:-true}"
      MEDICAL_RADAR_POLL_MINUTES: "${MEDICAL_RADAR_POLL_MINUTES:-180}"
      MEDICAL_RADAR_COLLECT_LIMIT_PER_TOPIC: "${MEDICAL_RADAR_COLLECT_LIMIT_PER_TOPIC:-5}"
      MEDICAL_RADAR_MIN_PUBLISH_MODE: "${MEDICAL_RADAR_MIN_PUBLISH_MODE:-skip_high_hype}"
      TELEGRAM_DRY_RUN: "${TELEGRAM_DRY_RUN:-true}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
    volumes:
      - medical-radar-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  medical-radar-data:
